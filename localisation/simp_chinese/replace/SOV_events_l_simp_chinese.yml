l_simp_chinese:
 wzsy.1.t: "杜金遇刺！"
 wzsy.1.d: "天意发力了，无中生友上台(懒得写事件)"
 wzsy.1.a: "该死！"
 wzsy.1.a_tt: "想玩杜金你会打这个MOD？"
 wzsy.2.t: "不幸的悲剧"
 wzsy.2.d: "杜金去世后无中生友接管了欧亚国，他的治理下俄罗斯开始恢复了元气，为了激励俄罗斯复兴，无中生友举办了一场盛大的阅兵仪式。从T-14到苏57，从bmpt到图-160,俄罗斯的钢铁洪流在红场上穿梭着，就在这令人振奋的日子里，刺杀降临了。一位黑衣人举着RPG-7向着总统方向发射而去，现场的人无不震惊惶恐地看着"
 wzsy.2.a: "万幸的是此次事故中仅有三位俄国人去世"
 wzsy.2.a_tt: "好似"
 wzsy.2.b: "在本次事件中我们伟大的领袖无中生友不幸去世"
 wzsy.2.b_tt: "无指导走了我们吃什么？"
 wzsy.3.t: "唯一的解决方法"
 wzsy.3.d: "没有无指导就没有强大的俄罗斯，我们必须不计一切代价把无指导救回来，将无指导的意识上传到互联网将是一个不错的选择，这样他将永远领导我们，为了报答无指导的救命之恩，新闻学三要素宣布加入我们"
 wzsy.3.a: "无指导终将领导我们"
 wzsy.3.a_tt: "无指导终将领导我们"
 wzsy.4.t: "铸造天国"
 wzsy.4.d: "他们曾握着铅笔，捏着橡皮，在巨熊广袤冰冷的版图之上，肆意勾划、涂改，刻下属于我们的累累伤痕。国土被撕裂，命运被旁人随意裁定，苦难像寒雾长久笼罩在故土之上。但我们从未就此沉沦，心底始终揣着不灭的星火与希望，在荆棘之中一次次砥砺奋进，咬紧牙关发愤图强，所有挣扎与前行，只为抚平旧日伤疤，洗刷刻在民族骨血里的耻辱。\n10多年前，克里米亚危机来临。那时没有人能够预料，浴火新生的俄罗斯会毅然站到风暴中央，以雷霆之势撼动整个世界，给灰暗的旧秩序带去一场惊天震撼。可即便我们奋力攀登，终于屹立于世界之巅，这个冷漠的世界却不肯给予我们本该拥有的尊重。\n惨烈的第一次欧陆战争带走了本该属于我们的一切，但欧洲大地上无数受苦的民众，依旧在压迫与苦难里挣扎，深陷水深火热之中。\n因为我们亲身尝尽屈辱的滋味，饱受过所谓“牧田名著”的践踏与冷眼，所以我们立下誓言：要竭尽所能，让全欧洲的人民，再也不必承受和我们一样的苦难与屈辱。\n亲爱的玩家，如今，在你的引领之下，欧亚人民至上天国终于斩断枷锁，解放了整片欧洲大陆。我们在破碎的土地上建起一座座幸福区，抚平战火留下的疮痍，让流离失所的百姓得以安稳落脚、安居乐业。我们向所有人民郑重起誓：我们的征途不会止步于此，终有一日，要把安宁、平等与幸福，带给全世界每一个角落的人民。"
 wzsy.4.a: "破晓时分"
 wzsy.4.a_tt: "§Y烈焰升腾§!·§C欧亚人民至上天国模组§!，感谢您的游玩，§0昔日已去，今朝光明§!，希望本§Ymod§!能给予您身心的§R净化§!！\n—§Y解锁正当化战争目标§!\n—§Y解锁邀请阵营§!\n—§Y解锁保障独立§!"
 wzsy.5.t: "欧洲统一"
 wzsy.5.d: "第二次欧陆战争以俄罗斯强力席卷欧洲而结束，战后俄罗斯领导人赛博无中生友宣布他将统一整个欧洲于一面旗下，带领全欧洲人奔向更加美好的明天。世界其他国家对此议论纷纷，一个统一的欧洲恐怕将主导全球的秩序"
 wzsy.5.a: "世界迎来大变"
 wzsy.5.a_tt: "在重庆大学的深处，一串红色的代码跳动着......"